x-app-environment: &app-environment
  IS_DEBUG: "false"
  BOT_TOKEN: ${BOT_TOKEN}
  CHANNEL_URL: ${CHANNEL_URL}
  CHAT_URL: ${CHAT_URL}
  ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD}
  ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY}
  ADMIN_PORT: ${ADMIN_PORT:-8080}
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_HOST: ${POSTGRES_HOST:-pg}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_DB: ${REDIS_DB:-0}
  EXPIRE: ${EXPIRE:-3600}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  admin:
    container_name: admin-tarot
    build:
      dockerfile: Dockerfile
    environment: *app-environment
    command: sh -c "alembic upgrade head && python -m bot.run_admin"
    ports:
      - "${ADMIN_PORT:-8080}:${ADMIN_PORT:-8080}"
    depends_on:
      pg:
        condition: service_healthy
    restart: unless-stopped

  bot:
    container_name: bot-tarot
    build:
      dockerfile: Dockerfile
    environment: *app-environment
    command: python -m bot.run_bot
    depends_on:
      pg:
        condition: service_healthy
      admin:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

  pg:
    container_name: pg-tarot
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tarot}
      POSTGRES_USER: ${POSTGRES_USER:-tarot}
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      start_period: 5s
      interval: 1m
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    container_name: redis-tarot
    image: redis:latest
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      start_period: 5s
      interval: 1m
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
